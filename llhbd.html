<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>宝贝乐乐生日快乐</title>
    <style>
        /* ================= 基础样式与背景 ================= */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #050914; /* 备用底色 */
        }

        /* 深蓝星空渐变背景 */
        #bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            /* 替换CSS背景图示例：background-image: url('https://your-image-url.jpg'); */
            background: radial-gradient(circle at center, #1b2735 0%, #050914 100%);
        }

        /* ================= 密码锁界面 ================= */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 9, 20, 0.85); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: white; transition: opacity 1s ease;
        }
        #login-screen h1 { font-size: 2.5rem; color: #ff9a9e; text-shadow: 0 0 15px rgba(255,154,158,0.6); margin-bottom: 30px;}
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #pwd-input {
            padding: 15px 20px; font-size: 1.5rem; text-align: center; border-radius: 30px;
            border: 2px solid #ff9a9e; background: rgba(255,255,255,0.1); color: white;
            outline: none; letter-spacing: 5px; width: 150px;
        }
        #btn-unlock {
            padding: 12px 40px; font-size: 1.2rem; border-radius: 30px; border: none;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #d81b60; font-weight: bold; cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        #btn-unlock:active { transform: scale(0.95); }
        #error-msg { color: #ff4d4d; font-size: 1rem; min-height: 20px; opacity: 0; transition: opacity 0.3s;}

        /* ================= 3D 容器 ================= */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;}

        /* CSS2D 标签样式 (蜡烛编号) */
        .candle-label {
            color: #fff; font-size: 14px; font-weight: bold; text-shadow: 0 0 4px #000;
            pointer-events: none; margin-top: 15px;
        }

        /* ================= UI 界面 ================= */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: none;
        }
        
        /* 吹气按钮 */
        #blow-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 1.2rem; border-radius: 50px; border: none;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white; font-weight: bold; cursor: pointer; pointer-events: auto;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); transition: all 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        #blow-btn:hover { box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6); transform: translateX(-50%) scale(1.05); }
        
        /* 音乐控制按钮 */
        #music-btn {
            position: absolute; bottom: 40px; right: 40px; width: 50px; height: 50px;
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.3);
            color: white; font-size: 1.5rem; cursor: pointer; pointer-events: auto;
            backdrop-filter: blur(5px); transition: all 0.3s; display: flex;
            justify-content: center; align-items: center;
        }
        #music-btn.playing { border-color: #ff9a9e; color: #ff9a9e; animation: pulse 2s infinite; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(255,154,158,0.4);} 70% {box-shadow: 0 0 0 15px rgba(255,154,158,0);} 100% {box-shadow: 0 0 0 0 rgba(255,154,158,0);} }

        /* Toast 提示框 */
        #toast {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 154, 158, 0.9); backdrop-filter: blur(10px);
            color: #fff; padding: 15px 30px; border-radius: 20px; font-size: 1.2rem;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; pointer-events: none; transition: opacity 0.5s, top 0.5s;
            max-width: 80%; line-height: 1.5; font-weight: bold;
        }

        /* 提示用户文字 */
        .instruction { position: absolute; top: 30px; width: 100%; text-align: center; color: rgba(255,255,255,0.7); font-size: 1rem; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 渐变背景 -->
    <div id="bg-container"></div>

    <!-- 音乐播放器 -->
    <!-- ================= 【替换背景音乐链接的位置】 ================= -->
    <!-- 下方 src 链接可替换为您喜欢的MP3链接。当前使用的是维基百科免版权生日快乐钢琴曲 -->
    <audio id="bg-music" src="https://upload.wikimedia.org/wikipedia/commons/3/33/Happy_Birthday_To_You_%28Piano_Version%29.ogg" loop preload="auto"></audio>

    <!-- 密码锁界面 -->
    <div id="login-screen">
        <h1>🎂 宝贝乐乐生日 🎂</h1>
        <div class="input-group">
            <input type="password" id="pwd-input" placeholder="输入密码" maxlength="4" autocomplete="off">
            <div id="error-msg">密码错误，请重试哦~</div>
            <button id="btn-unlock">解锁惊喜</button>
        </div>
    </div>

    <!-- 3D 场景容器 -->
    <div id="canvas-container"></div>

    <!-- 交互 UI 界面 -->
    <div id="ui-layer">
        <div class="instruction">滑动屏幕可全方位观看，点击蜡烛许愿</div>
        <div id="toast"></div>
        <button id="blow-btn">
            🎤 <span>一口气吹灭</span>
        </button>
        <button id="music-btn" title="播放/暂停音乐">🔇</button>
    </div>

    <!-- 引入外部 CDN 依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // ================= 数据字典 =================
        const CORRECT_PWD = "0508";
        const BLESSINGS = [
            "亲爱的乐乐，22岁生日快乐！愿你岁岁平安！", "乐乐，新的一岁，愿你被世界温柔以待。", 
            "乐乐宝贝，愿你的笑容如今天般灿烂！", "22岁，最好的年纪，乐乐冲鸭！", 
            "愿乐乐每天都能吃好喝好，快乐无烦恼！", "乐乐，我的宝贝，生日快乐，永远爱你！", 
            "愿乐乐的22岁，有星辰大海，有良人相伴。", "乐乐，愿你所有的心愿都能如愿以偿！", 
            "22岁的乐乐，要继续闪闪发光哦！", "乐乐，生日快乐！每一天都要甜甜的！", 
            "愿乐乐的生活充满阳光，好运连连！", "亲爱的乐乐，祝你生日快乐，平安喜乐！", 
            "乐乐，愿你遍历山河，觉得人间值得。", "22岁啦，乐乐要做一个无忧无虑的大人！", 
            "乐乐，愿你的未来如星空般璀璨夺目。", "祝我的乐乐生日快乐，心想事成！", 
            "乐乐，愿你所得皆所期，所求皆如愿。", "22岁，新起点，乐乐宝贝勇往直前！", 
            "乐乐，愿你的每一天都充满惊喜和感动。", "亲爱的乐乐，愿你永远像个孩子般快乐。", 
            "乐乐，生日快乐！我会一直陪在你身边。", "22根蜡烛，22个心愿，乐乐一定会幸福！"
        ];

        // ================= 基础逻辑控制 =================
        const loginScreen = document.getElementById('login-screen');
        const pwdInput = document.getElementById('pwd-input');
        const btnUnlock = document.getElementById('btn-unlock');
        const errorMsg = document.getElementById('error-msg');
        const uiLayer = document.getElementById('ui-layer');
        const blowBtn = document.getElementById('blow-btn');
        const musicBtn = document.getElementById('music-btn');
        const toastEl = document.getElementById('toast');
        const audio = document.getElementById('bg-music');

        // 密码解锁与音乐自动播放逻辑
        let isPlaying = false;
        btnUnlock.addEventListener('click', () => {
            if(pwdInput.value === CORRECT_PWD) {
                // 解锁成功
                loginScreen.style.opacity = '0';
                
                // 【修复音乐问题】 在用户点击事件中立即执行 play()
                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerHTML = '🎵';
                    musicBtn.classList.add('playing');
                }).catch(e => {
                    console.log("自动播放仍然被阻止，需用户手动点击:", e);
                    musicBtn.innerHTML = '🔇';
                });

                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    uiLayer.style.display = 'block';
                    init3DScene(); // 初始化3D场景
                }, 1000);
            } else {
                errorMsg.style.opacity = '1';
                pwdInput.value = '';
                setTimeout(() => errorMsg.style.opacity = '0', 2000);
            }
        });

        // 手动音乐控制
        musicBtn.addEventListener('click', () => {
            if(isPlaying) { 
                audio.pause(); 
                musicBtn.classList.remove('playing'); 
                musicBtn.innerHTML = '🔇';
            } else { 
                audio.play(); 
                musicBtn.classList.add('playing'); 
                musicBtn.innerHTML = '🎵';
            }
            isPlaying = !isPlaying;
        });

        // Toast 提示框封装
        let toastTimeout;
        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.style.opacity = '1';
            toastEl.style.top = '25%';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.style.opacity = '0';
                toastEl.style.top = '20%';
            }, 3000);
        }

        // ================= 3D 核心逻辑 =================
        let scene, camera, renderer, labelRenderer, controls;
        let candles = []; 
        let smokeParticles = []; 
        let starParticles; // 3D星星粒子
        let isBlowing = false;
        const clock = new THREE.Clock();

        function init3DScene() {
            const container = document.getElementById('canvas-container');

            // 1. 场景
            scene = new THREE.Scene();
            
            // 2. 相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);

            // 3. 渲染器 (WebGL)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. CSS2D 渲染器 (用于蜡烛编号)
            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none'; // 防阻挡点击
            container.appendChild(labelRenderer.domElement);

            // 5. 光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
            dirLight.position.set(15, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const candleLight = new THREE.PointLight(0xffaa00, 1.2, 35);
            candleLight.position.set(0, 8, 0);
            scene.add(candleLight);

            // 6. 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2; // 不允许看底盘以下
            controls.minDistance = 15;
            controls.maxDistance = 50;

            // 7. 构建场景元素
            createStars(); // 浪漫星空粒子
            buildCake();
            buildCandles();

            // 8. 交互事件
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            // 9. 启动动画
            animate();
        }

        // 创建3D浪漫星空
        function createStars() {
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 1000; // 星星数量
            const posArray = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i++) {
                // 散布在很大的空间中
                posArray[i] = (Math.random() - 0.5) * 200; 
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const starsMat = new THREE.PointsMaterial({
                size: 0.8,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            starParticles = new THREE.Points(starsGeo, starsMat);
            scene.add(starParticles);
        }

        // 构建蛋糕模型 (增加照片墙)
        function buildCake() {
            const cakeGroup = new THREE.Group();

            // 材质
            const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
            const matPink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.8 });
            const matBlue = new THREE.MeshStandardMaterial({ color: 0xadd8e6, roughness: 0.8 });
            const matStand = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.3, roughness: 0.4 });

            // 展台
            const standGeo = new THREE.CylinderGeometry(8.5, 9, 0.5, 64);
            const stand = new THREE.Mesh(standGeo, matStand);
            stand.position.y = -0.25;
            stand.receiveShadow = true;
            cakeGroup.add(stand);

            // 底层 (蓝色)
            const layer1Radius = 7.5;
            const layer1Geo = new THREE.CylinderGeometry(layer1Radius, layer1Radius, 3, 64);
            const layer1 = new THREE.Mesh(layer1Geo, matBlue);
            layer1.position.y = 1.5;
            layer1.castShadow = true; layer1.receiveShadow = true;
            cakeGroup.add(layer1);

            // 中层 (粉色)
            const layer2Geo = new THREE.CylinderGeometry(5.5, 5.5, 2.5, 64);
            const layer2 = new THREE.Mesh(layer2Geo, matPink);
            layer2.position.y = 4.25;
            layer2.castShadow = true; layer2.receiveShadow = true;
            cakeGroup.add(layer2);

            // 顶层 (奶油白)
            const layer3Geo = new THREE.CylinderGeometry(4, 4, 2, 64);
            const layer3 = new THREE.Mesh(layer3Geo, matWhite);
            layer3.position.y = 6.5;
            layer3.castShadow = true; layer3.receiveShadow = true;
            cakeGroup.add(layer3);

            // ================= 【修改1：在底层侧面贴5张照片】 =================
            const numPhotos = 5;
            const photoGeo = new THREE.PlaneGeometry(3, 2.2); // 照片尺寸
            const frameGeo = new THREE.PlaneGeometry(3.3, 2.5); // 白色相框尺寸
            const emojis = ['📷', '🎂', '🎈', '🎁', '❤️'];

            for(let i = 0; i < numPhotos; i++) {
                const angle = i * (Math.PI * 2) / numPhotos;
                
                // 1. 创建白色相框底板，使其有一点凸出立体感
                const frameMat = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.5});
                const frame = new THREE.Mesh(frameGeo, frameMat);
                // 贴在底层外壁上 (半径加上0.01防止与蛋糕重叠闪烁)
                frame.position.set(Math.cos(angle) * (layer1Radius + 0.05), 1.5, Math.sin(angle) * (layer1Radius + 0.05));
                frame.rotation.y = -angle + Math.PI / 2; // 面向外侧
                cakeGroup.add(frame);

                // 2. 创建照片内容
                // 默认使用 Canvas 生成 Emoji 占位图
                const canvas = document.createElement('canvas');
                canvas.width = 300; canvas.height = 220;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffcfcf'; // 浅粉色背景
                ctx.fillRect(0,0,300,220);
                ctx.fillStyle = '#d81b60';
                ctx.font = '80px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emojis[i], 150, 110);
                
                let photoTex = new THREE.CanvasTexture(canvas);

                // ================= 【替换照片的位置】 =================
                // 想要替换成真实照片，请注释掉上面的 Emoji 逻辑，并把下面这行解除注释，换上你的图片URL：
                // photoTex = new THREE.TextureLoader().load('https://your-image-url.jpg');
                // =======================================================

                const photoMat = new THREE.MeshBasicMaterial({map: photoTex});
                const photo = new THREE.Mesh(photoGeo, photoMat);
                // 照片比相框再稍微向外凸出一点点
                photo.position.set(Math.cos(angle) * (layer1Radius + 0.07), 1.5, Math.sin(angle) * (layer1Radius + 0.07));
                photo.rotation.y = -angle + Math.PI / 2;
                cakeGroup.add(photo);
            }

            // 装饰：糖珠 (随机散布在三层顶部)
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            const sprinkleGeo = new THREE.SphereGeometry(0.1, 8, 8);
            for(let i=0; i<100; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const mat = new THREE.MeshStandardMaterial({color: color});
                const mesh = new THREE.Mesh(sprinkleGeo, mat);
                
                const layer = Math.floor(Math.random() * 3);
                const radii = [7.5, 5.5, 4];
                const heights = [3, 5.5, 7.5];
                
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * (radii[layer] - 0.2);
                mesh.position.set(Math.cos(angle)*r, heights[layer], Math.sin(angle)*r);
                cakeGroup.add(mesh);
            }

            // 巧克力牌 "22"
            const plaqueCanvas = document.createElement('canvas');
            plaqueCanvas.width = 256; plaqueCanvas.height = 128;
            const pctx = plaqueCanvas.getContext('2d');
            pctx.fillStyle = '#5c3a21'; 
            pctx.fillRoundRect = function(x,y,w,h,r) {
                this.beginPath(); this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
                this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h);
                this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y); this.fill();
            }
            pctx.fillRoundRect(0,0,256,128,20);
            pctx.fillStyle = '#fff';
            pctx.font = 'bold 80px Arial';
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            pctx.fillText('22', 128, 64);
            
            const plaqueTex = new THREE.CanvasTexture(plaqueCanvas);
            const plaqueGeo = new THREE.BoxGeometry(2.5, 1.2, 0.2);
            const plaqueMat = new THREE.MeshStandardMaterial({ map: plaqueTex });
            const plaque = new THREE.Mesh(plaqueGeo, plaqueMat);
            plaque.position.set(0, 7.5, 2.5); 
            plaque.rotation.x = -Math.PI / 8; 
            cakeGroup.add(plaque);

            scene.add(cakeGroup);
        }

        // 生成火焰和烟雾纹理
        function createFlameTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 200, 0, 1)');
            grad.addColorStop(0.5, 'rgba(255, 50, 0, 0.6)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        function createSmokeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }
        const flameTex = createFlameTexture();
        const smokeTex = createSmokeTexture();

        // 构建22根蜡烛
        function buildCandles() {
            const candleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5, 16);
            const candleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const wickGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
            const wickMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const flameMat = new THREE.SpriteMaterial({ map: flameTex, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending });

            const total = 22, outerCount = 14, innerCount = 8;
            const outerRadius = 3.2, innerRadius = 1.6;

            for(let i=0; i<total; i++) {
                const group = new THREE.Group();
                const body = new THREE.Mesh(candleGeo, candleMat);
                body.position.y = 0.75; body.castShadow = true;
                group.add(body);

                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.y = 1.6;
                group.add(wick);

                const flame = new THREE.Sprite(flameMat.clone());
                flame.position.y = 1.8; flame.scale.set(0.6, 0.8, 1);
                group.add(flame);

                const div = document.createElement('div');
                div.className = 'candle-label'; div.textContent = i + 1;
                const label = new THREE.CSS2DObject(div);
                label.position.set(0, 2.2, 0);
                group.add(label);

                let angle, r;
                if(i < outerCount) { angle = (i / outerCount) * Math.PI * 2; r = outerRadius; } 
                else { angle = ((i - outerCount) / innerCount) * Math.PI * 2 + 0.5; r = innerRadius; }
                
                group.position.set(Math.cos(angle)*r, 7.5, Math.sin(angle)*r);
                body.userData = { id: i, parentGroup: group }; // 绑定交互ID
                scene.add(group);

                candles.push({ id: i, mesh: body, flame: flame, isLit: true, group: group });
            }
        }

        // ================= 交互逻辑：点击与吹灭 =================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(candles.map(c => c.mesh));

            if(intersects.length > 0) {
                extinguishCandle(intersects[0].object.userData.id);
            }
        }

        function extinguishCandle(id) {
            const candle = candles[id];
            showToast(BLESSINGS[id]);
            if(!candle.isLit) return;
            candle.isLit = false;
            candle.flame.visible = false;
            spawnSmoke(candle.group.position);
            checkWin();
        }

        function spawnSmoke(pos) {
            const mat = new THREE.SpriteMaterial({ map: smokeTex, color: 0xffffff, transparent: true, opacity: 0.8 });
            for(let i=0; i<3; i++) {
                const sprite = new THREE.Sprite(mat);
                sprite.position.copy(pos); sprite.position.y += 1.8; 
                sprite.userData = { vx: (Math.random() - 0.5) * 0.02, vy: 0.02 + Math.random() * 0.02, vz: (Math.random() - 0.5) * 0.02, life: 1.0 };
                scene.add(sprite); smokeParticles.push(sprite);
            }
        }

        function updateSmoke() {
            for(let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.life -= 0.01; p.material.opacity = p.userData.life;
                p.scale.setScalar(1 + (1 - p.userData.life) * 2);
                if(p.userData.life <= 0) { scene.remove(p); smokeParticles.splice(i, 1); }
            }
        }

        // 吹气按钮逻辑
        blowBtn.addEventListener('click', () => {
            if(candles.every(c => !c.isLit)) return showToast("蜡烛已经全都熄灭啦！");
            isBlowing = true; blowBtn.style.pointerEvents = 'none'; 
            
            setTimeout(() => {
                isBlowing = false;
                candles.forEach(c => {
                    if(c.isLit) { c.isLit = false; c.flame.visible = false; spawnSmoke(c.group.position); }
                });
                showToast("哇！乐乐一口气吹灭了所有蜡烛！生日快乐！");
                setTimeout(triggerConfetti, 500);
                blowBtn.style.display = 'none'; 
            }, 800);
        });

        function checkWin() {
            if(candles.every(c => !c.isLit)) {
                setTimeout(() => { showToast("蜡烛全部吹灭啦！祝乐乐岁岁平安！"); triggerConfetti(); blowBtn.style.display = 'none'; }, 500);
            }
        }

        // 庆祝烟花特效
        function triggerConfetti() {
            const duration = 3000, end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffb6c1', '#add8e6', '#ffffff', '#ffaa00'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffb6c1', '#add8e6', '#ffffff', '#ffaa00'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // ================= 渲染循环 =================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            controls.update();

            // 背景星星缓慢旋转
            if(starParticles) starParticles.rotation.y += 0.0005;

            // 火焰动画
            candles.forEach(c => {
                if(c.isLit) {
                    let scaleXY = 0.6 + Math.sin(time * 10 + c.id) * 0.05;
                    if(isBlowing) { scaleXY -= 0.2; c.flame.position.x = Math.sin(time * 50 + c.id) * 0.1; } 
                    else { c.flame.position.x = 0; }
                    c.flame.scale.set(scaleXY, 0.8 + Math.random()*0.1, 1);
                }
            });

            updateSmoke();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

    </script>
</body>
</html>
